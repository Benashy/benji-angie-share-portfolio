<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Access</title>
  <link rel="icon" href="favicon.svg?v=2026-06-03-portfolio-icon-1" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2026-08-17-precision-grid-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js?v=2026-06-03-live-test-fixes-5"></script>
</head>
<body>
  <div id="bootScreen" class="boot-screen">
    <div>
      <span class="boot-mark"></span>
      <p>Loading secure session...</p>
    </div>
  </div>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-monogram">BA</span>
        <div><strong>Portfolio</strong><small>Private wealth</small></div>
      </div>
      <nav class="sidebar-nav" aria-label="Portfolio sections">
        <button class="nav active" data-view="dashboard"><span>01</span>Dashboard</button>
        <button class="nav" data-view="holdings"><span>02</span>Holdings</button>
        <button class="nav" data-view="transaction"><span>03</span>New Transaction</button>
        <button class="nav" data-view="ledger"><span>04</span>Ledger</button>
        <button class="nav" data-view="reports"><span>05</span>Reports</button>
        <button class="nav" data-view="audit"><span>06</span>Audit</button>
      </nav>
      <p class="sidebar-caption">Benji and Angie's<br>Investment Portfolio</p>
    </aside>

    <main class="page">
      <section class="hero">
        <div class="hero-heading">
          <span class="hero-product">Benji and Angie's Investment Portfolio</span>
          <h1 id="viewTitle">Dashboard</h1>
          <p id="statusLine">Loading portfolio...</p>
        </div>
        <div class="hero-total">
          <span>Headline net worth</span>
          <div id="headlineNetWorth">-</div>
        </div>
      </section>

    <section id="authCard" class="card auth-card hidden">
      <h2>Sign In</h2>
      <p class="subtle">Enter your email and password to continue.</p>
      <label>Email</label>
      <input id="emailInput" type="email" autocomplete="email">
      <label>Password</label>
      <input id="passwordInput" type="password" autocomplete="current-password">
      <div class="button-row">
        <button id="signInButton">Sign in</button>
        <button id="magicLinkButton" class="secondary">Send magic link</button>
      </div>
      <p id="authMessage" class="message"></p>
    </section>

    <section id="presencePanel" class="presence-panel hidden">
      <button type="button" class="secondary small refresh-prices-action">Refresh prices</button>
      <span id="marketDataSummary">Market data not loaded</span>
      <span id="benjiPresence">Benji offline</span>
      <span id="angiePresence">Angie offline</span>
      <button id="refreshCloudButton" class="secondary small hidden">New data available - refresh</button>
      <button id="signOutButton" class="secondary small">Sign out</button>
    </section>

    <section id="dashboardView" class="view"></section>
    <section id="holdingsView" class="view hidden"></section>
    <section id="transactionView" class="view hidden"></section>
    <section id="ledgerView" class="view hidden"></section>
    <section id="reportsView" class="view hidden"></section>
      <section id="auditView" class="view hidden"></section>
    </main>
  </div>

  <script type="module" src="app.js?v=2026-08-17-precision-grid-1"></script>
</body>
</html>
